services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: bash -c "alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecretpassword@db:5432/postgres
      - DRIFT_MAPE_THRESHOLD=0.15
      - DRIFT_DAYS=7
      - ML_ACTIVE_NAME=calce
      - PRD_POLICY_NAME=default
      - PRD_STOCK_OPEN=100000
      - PRD_DOMESTIC_DEMAND=85000
      - PRD_HORIZON_DAYS=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A celery_worker.celery_app worker -l INFO -B
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecretpassword@db:5432/postgres
      - DRIFT_MAPE_THRESHOLD=0.15
      - DRIFT_DAYS=7
      - ML_ACTIVE_NAME=calce
      - PRD_POLICY_NAME=default
      - PRD_STOCK_OPEN=100000
      - PRD_DOMESTIC_DEMAND=85000
      - PRD_HORIZON_DAYS=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yaml

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:

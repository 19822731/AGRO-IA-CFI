name: Agro-IA CI/CD Pipeline (CFI Audit Ready)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit-tests:
    name: Backend Test Suite & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Invariants & Contracts
        run: |
          pytest backend/tests/test_db_invariants.py -v --disable-warnings
          pytest backend/tests/tests_p22/ -v --disable-warnings
          pytest backend/tests/tests_p23/ -v --disable-warnings
          pytest backend/tests/tests_p24/ -v --disable-warnings

  frontend-check:
    name: Frontend Lint & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/sugartrade_contents/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend/sugartrade_contents
        run: npm ci --legacy-peer-deps

      - name: Verify Next.js Build
        working-directory: ./frontend/sugartrade_contents
        run: npm run build

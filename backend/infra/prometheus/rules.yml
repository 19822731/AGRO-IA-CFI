- name: prd
  rules:
  - alert: PRDStale
    expr: (time() - prd_last_decision_ts) > 36*3600
    for: 30m
    labels: { severity: warning }
    annotations:
      summary: "PRD sin actualización"
      description: "No hay decisión vigente en las últimas 36h."

  - alert: PRDOptimizeFailures
    expr: increase(prd_optimize_fail_total[30m]) > 0
    for: 10m
    labels: { severity: critical }
    annotations:
      summary: "Fallos al persistir decisiones PRD"
      description: "Revisar logs con correlation_id."

  - alert: MissingPolicy
    expr: mcp_active_flag == 0
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "No hay política de comisiones activa"
      description: "Definir/vigilar market_commission_policy vigente."

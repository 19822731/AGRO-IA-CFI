groups:
- name: agroia-api
  rules:
  - alert: HighLatencyP95
    expr: histogram_quantile(0.95, sum by (le, handler)(rate(http_request_duration_seconds_bucket[5m]))) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Latencia p95 alta (API)"
      description: "El endpoint {{ $labels.handler }} tiene una latencia p95 superior a 500ms."

  - alert: APIHigh5xxErrorRatio
    expr: |
      (
        sum by (handler) (rate(http_requests_total{job="fastapi-app",status=~"5.."}[5m]))
        /
        sum by (handler) (rate(http_requests_total{job="fastapi-app"}[5m]))
      ) > 0.10
    for: 10m
    labels: { severity: critical }
    annotations:
      summary: "Tasa de 5xx >10% en {{ $labels.handler }}"

  - alert: APIHigh4xxErrorRatio
    expr: |
      (
        sum by (handler) (rate(http_requests_total{job="fastapi-app",status=~"4.."}[5m]))
        /
        sum by (handler) (rate(http_requests_total{job="fastapi-app"}[5m]))
      ) > 0.20
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "Tasa de 4xx >20% en {{ $labels.handler }}"


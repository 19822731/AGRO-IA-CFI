server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: agroia_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: agroia
      __path__: /var/log/app.log
  pipeline_stages:
    - json:
        expressions:
          level: level
          correlation_id: correlation_id
          logger: name
    - labels:
        level:
        correlation_id:
        logger:
    - match:
        selector: '{level!="ERROR"}'
        action: keep
        stages:
          - labeldrop:
              - correlation_id
